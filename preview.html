<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="fonts.css"><title>체리소다클럽 · 화면 미리보기</title><style>*{box-sizing:border-box}body{margin:0;background:#f3eaf0;color:#302830;font-family:SUIT,sans-serif}header{padding:16px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#171218;color:white}header strong{font-family:SlowGothic,SUIT,sans-serif;font-weight:400}a{color:inherit}select{padding:9px 12px;font:inherit;border:0;border-radius:8px}main{padding:20px 12px;display:flex;justify-content:center}.device{width:390px;max-width:100%;border:1px solid #d6b6c8;border-radius:16px;overflow:hidden;background:white;box-shadow:0 5px 20px #44223712}iframe{width:100%;height:calc(100dvh - 135px);min-height:600px;display:block;border:0}.hint{text-align:center;font-size:12px;padding:10px;color:#846475}</style></head><body><header><strong>🍒 화면 미리보기</strong><label>화면 크기 <select id="size" aria-label="미리보기 화면 크기"><option value="360">작은 모바일 · 360px</option><option value="390" selected>모바일 · 390px</option><option value="768">태블릿 · 768px</option><option value="1100">PC · 1100px</option></select></label><a href="admin.html">관리 화면으로</a></header><main><div class="device" id="device"><iframe id="site" title="체리소다클럽 미리보기" src="index.html"></iframe></div></main><div class="hint" id="hint">현재 공개된 사이트의 미리보기입니다.</div><script>if(new URLSearchParams(location.search).get('draft')==='1'){document.getElementById('site').src='index.html?preview=1';document.getElementById('hint').textContent='이 브라우저에 저장한 초안의 미리보기입니다.';}document.getElementById('size').onchange=e=>document.getElementById('device').style.width=e.target.value+'px';</script></body></html>
